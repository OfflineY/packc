[Default]
# 默认识别扩展名，逗号分隔
Extensions = .go,.js,.py,.java,.c,.cpp,.rs,.md,.txt
# 单个文件最大大小，支持 KB/MB/GB
MaxSize = 1MB
# 默认输出文件名
Output = packc_output.txt
# 保留注释
KeepComments = false
# 跳过依赖目录node_modules, vendor等 
SkipDeps = true
# Token统计
ShowStats = true
# 启用备份
BackupEnabled = true
BackupRetentionDays = 7
